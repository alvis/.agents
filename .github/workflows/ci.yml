# repository quality gate — see AGENTS.md "Hard limits" for what it enforces.
# every gate is a spec, so CI runs the one command a contributor runs. the
# `--bun` flag is load-bearing rather than cosmetic: vitest's bin carries a
# Node shebang, so plain `bunx vitest` launches under Bun but executes the
# specs under Node, and the discover renderer bundles pages with Bun.build,
# which Node does not provide. `claude plugin validate` is deliberately not
# wired in.
name: ci

on:
  push:
    branches: [master]
  # the default types omit ready_for_review, so a draft that was never pushed to
  # after its last run would be marked ready with no run against that state.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: vitest
        run: bunx --bun vitest@^4.0.0 run
