<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>Anatomy of an order row</title>
  <defs>
    <marker id="anatomy-tick" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M4 0v8" stroke="var(--ui-faint, #8a8f98)" stroke-width="1.2" />
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="300" fill="var(--ui-surface, #ffffff)" />

  <!-- the row itself -->
  <rect x="60" y="70" width="600" height="72" rx="10"
        fill="var(--ui-raised, #faf8f5)" stroke="var(--ui-border, #e2ddd6)" />
  <rect x="60" y="70" width="4" height="72" rx="2" fill="var(--ui-accent, #b8452f)" />

  <text x="88" y="100" font-family="ui-monospace, monospace" font-size="14"
        fill="var(--ui-ink, #2c3038)">MER-4471</text>
  <text x="88" y="122" font-family="system-ui, sans-serif" font-size="13"
        fill="var(--ui-muted, #6d7684)">Ridgeline Supply · 14 lines</text>

  <rect x="330" y="92" width="96" height="28" rx="14"
        fill="var(--ui-amber-soft, #f7ecd4)" stroke="var(--ui-amber, #b4801f)" />
  <text x="378" y="111" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--ui-amber-ink, #6b4a06)">Part-picked</text>

  <text x="470" y="111" font-family="ui-monospace, monospace" font-size="14"
        fill="var(--ui-ink, #2c3038)">£12,480.00</text>

  <rect x="586" y="90" width="56" height="32" rx="8"
        fill="var(--ui-accent, #b8452f)" />
  <text x="614" y="111" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--ui-on-accent, #ffffff)">Open</text>

  <!-- measurement rules -->
  <g stroke="var(--ui-faint, #8a8f98)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M60 60V44M660 60V44" />
    <path d="M60 52h600" stroke-dasharray="0" marker-start="url(#anatomy-tick)" marker-end="url(#anatomy-tick)" />
    <path d="M44 70h-16M44 142h-16" />
    <path d="M36 70v72" stroke-dasharray="0" marker-start="url(#anatomy-tick)" marker-end="url(#anatomy-tick)" />
  </g>
  <text x="360" y="40" text-anchor="middle" font-family="ui-monospace, monospace"
        font-size="11" fill="var(--ui-faint, #8a8f98)">fluid, 640 max</text>
  <text x="30" y="106" text-anchor="middle" font-family="ui-monospace, monospace"
        font-size="11" fill="var(--ui-faint, #8a8f98)" transform="rotate(-90 30 106)">72</text>

  <!-- the focused state, drawn rather than described -->
  <rect x="60" y="188" width="600" height="72" rx="10"
        fill="var(--ui-raised, #faf8f5)" stroke="var(--ui-border, #e2ddd6)" />
  <rect x="56" y="184" width="608" height="80" rx="14" fill="none"
        stroke="var(--ui-focus, #2f6fb8)" stroke-width="3" />
  <text x="88" y="218" font-family="ui-monospace, monospace" font-size="14"
        fill="var(--ui-ink, #2c3038)">MER-4472</text>
  <text x="88" y="240" font-family="system-ui, sans-serif" font-size="13"
        fill="var(--ui-muted, #6d7684)">Halden Freight · 3 lines</text>
  <text x="470" y="229" font-family="ui-monospace, monospace" font-size="14"
        fill="var(--ui-ink, #2c3038)">£1,905.40</text>
  <text x="360" y="284" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="var(--ui-muted, #6d7684)">Keyboard focus: 3px ring, 4px outside the row, never the row's own border</text>
</svg>
